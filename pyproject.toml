[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "anamorph"
version = "0.1.0"
description = "Inspectable facial transformations and anonymization experiments for video"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "scipy>=1.12,<2",
]

[project.scripts]
anamorph = "anamorph.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.build-backend]
source-include = ["tests/**", "examples/**", "docs/**"]
